# GigaFinance: login page + signed session cookie (deploy/auth/server.mjs on
# 127.0.0.1:8790). Every request is checked with auth_request; the login
# service answers with the user's own dsh port, and nginx proxies there.

map $http_upgrade $gf_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8790/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location ~ ^/(login|logout|register|admin)$ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The login page needs the icon before a session exists.
    location = /favicon.svg {
        proxy_pass http://127.0.0.1:8801;
        proxy_set_header Host localhost:8801;
    }

    location @login {
        return 302 /login;
    }

    location / {
        auth_request /_auth;
        auth_request_set $gf_port $upstream_http_x_gf_port;
        error_page 401 = @login;

        proxy_pass http://127.0.0.1:$gf_port;
        proxy_http_version 1.1;
        # dsh only trusts loopback Hosts; the login service has authenticated the user.
        proxy_set_header Host localhost:$gf_port;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gf_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
