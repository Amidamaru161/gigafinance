# GigaFinance: login via HTTP basic auth, each user routed to their own
# dsh instance (own profile, sessions, workspace) listening on 127.0.0.1.
# Maps maintained by deploy/add-user.sh:
#   /etc/nginx/gigafinance-users.map   login -> port
#   /etc/nginx/gigafinance-tokens.map  login -> secret session token
#   /etc/nginx/gigafinance-sessions.map token -> port
# Browsers do not reliably send basic-auth credentials on WebSocket upgrades,
# so a successful login sets an HttpOnly cookie and the /api/events.*
# sockets are authenticated by that cookie instead.

map_hash_bucket_size 128;

map $remote_user $gf_port {
    default 1;  # unmapped login -> nothing listens -> 502
    include /etc/nginx/gigafinance-users.map;
}

map $remote_user $gf_token {
    default "";
    include /etc/nginx/gigafinance-tokens.map;
}

map $cookie_gf_session $gf_ws_port {
    default 0;
    include /etc/nginx/gigafinance-sessions.map;
}

map $http_upgrade $gf_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Origin "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $gf_connection;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ^~ /api/events. {
        if ($gf_ws_port = 0) { return 401; }
        proxy_pass http://127.0.0.1:$gf_ws_port;
        # dsh only trusts loopback Hosts; nginx has already authenticated the user.
        proxy_set_header Host localhost:$gf_ws_port;
    }

    location / {
        auth_basic           "GigaFinance";
        auth_basic_user_file /etc/nginx/gigafinance.htpasswd;

        add_header Set-Cookie "gf_session=$gf_token; Path=/; HttpOnly; SameSite=Strict" always;

        proxy_pass http://127.0.0.1:$gf_port;
        proxy_set_header Host localhost:$gf_port;
    }
}
